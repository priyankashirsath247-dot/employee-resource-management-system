<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Employees | ERMS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #020912;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: #071526;
        }

        .main-card {

            background: #0b1b30;

            border-radius: 20px;

            padding: 25px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.4);

        }

        .table {

            color: white;

        }

        .table thead {

            background: #122b48;

            color: #00d4ff;

        }

        .table tbody tr {

            border-color: #1c3653;

        }

        .table tbody tr:hover {

            background: #102640;

        }

        .employee-photo {

            width: 45px;

            height: 45px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #00d4ff;

        }

        .default-photo {

            width: 45px;

            height: 45px;

            border-radius: 50%;

            background: #00aaff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark px-4 py-3">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold">

            <i class="bi bi-people-fill"></i>

            ERMS Admin Panel

        </a>


        <a href="addemployee.html"
           class="btn btn-primary">

            <i class="bi bi-person-plus"></i>

            Add Employee

        </a>

    </div>

</nav>



<!-- MAIN -->

<div class="container py-5">


    <div class="main-card">


        <!-- HEADER -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2>

                    <i class="bi bi-people-fill text-info"></i>

                    All Employees

                </h2>

                <p class="text-secondary">

                    View all employees registered in the system

                </p>

            </div>


            <button
                onclick="loadEmployees()"
                class="btn btn-outline-info">

                <i class="bi bi-arrow-clockwise"></i>

                Refresh

            </button>

        </div>



        <!-- EMPLOYEE COUNT -->

        <div class="mb-3">

            Total Employees :

            <span
                id="employeeCount"
                class="badge bg-primary fs-6">

                0

            </span>

        </div>



        <!-- TABLE -->

        <div class="table-responsive">


            <table
                class="table table-hover align-middle">


                <thead>

                    <tr>

                        <th>#</th>

                        <th>Photo</th>

                        <th>Employee ID</th>

                        <th>Name</th>

                        <th>Mobile</th>

                        <th>Email</th>

                        <th>Department</th>

                        <th>Position</th>

                        <th>Salary</th>

                    </tr>

                </thead>



                <tbody id="employeeTable">

                    <tr>

                        <td
                            colspan="9"
                            class="text-center">

                            Loading employees...

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </div>


</div>



<script>


async function loadEmployees() {


    const table =
        document.getElementById("employeeTable");


    table.innerHTML = `

        <tr>

            <td
                colspan="9"
                class="text-center">

                Loading employees...

            </td>

        </tr>

    `;


    try {


        const response =
            await fetch("/employees");


        const employees =
            await response.json();


        console.log(
            "Employees:",
            employees
        );


        table.innerHTML = "";


        document.getElementById(
            "employeeCount"
        ).innerText =
            employees.length;


        if (
            employees.length === 0
        ) {


            table.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="text-center text-secondary">

                        No Employees Found

                    </td>

                </tr>

            `;


            return;

        }



        employees.forEach(
            (employee, index) => {


                let photoHTML;


                if (
                    employee.facePhoto
                ) {


                    photoHTML = `

                        <img

                            src="${employee.facePhoto}"

                            class="employee-photo"

                        >

                    `;


                }

                else {


                    photoHTML = `

                        <div
                            class="default-photo">

                            <i class="bi bi-person-fill"></i>

                        </div>

                    `;


                }



                table.innerHTML += `


                    <tr>


                        <td>

                            ${index + 1}

                        </td>



                        <td>

                            ${photoHTML}

                        </td>



                        <td>

                            ${employee.employeeId || "-"}

                        </td>



                        <td>

                            <strong>

                                ${employee.name || "-"}

                            </strong>

                        </td>



                        <td>

                            ${employee.mobile || "-"}

                        </td>



                        <td>

                            ${employee.email || "-"}

                        </td>



                        <td>

                            ${employee.department || "-"}

                        </td>



                        <td>

                            ${employee.position || "-"}

                        </td>



                        <td>

                            ₹${employee.salary || 0}

                        </td>


                    </tr>


                `;


            }
        );


    }


    catch (error) {


        console.error(error);


        table.innerHTML = `


            <tr>

                <td
                    colspan="9"
                    class="text-center text-danger">

                    Unable to load employees

                </td>

            </tr>


        `;


    }


}



document.addEventListener(

    "DOMContentLoaded",

    loadEmployees

);


</script>


</body>

</html>
