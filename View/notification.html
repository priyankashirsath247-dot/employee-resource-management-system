<script>

/* =========================================================
   NOTIFICATION BACKEND
========================================================= */

const API_BASE = "http://localhost:3000";

let notifications = [];


/* =========================================================
   GET EMPLOYEE ID
========================================================= */

function getEmployeeId(){

    const keys = [
        "employeeId",
        "empId",
        "loggedInEmployee",
        "employeeData",
        "erms_user"
    ];

    for(const key of keys){

        const value = localStorage.getItem(key);

        if(!value) continue;

        try{

            const obj = JSON.parse(value);

            if(typeof obj === "object" && obj){

                const id =
                    obj.employeeId ||
                    obj.employee_id ||
                    obj.empId ||
                    obj.id ||
                    obj._id;

                if(id){
                    return String(id);
                }
            }

        }
        catch(error){

            if(value.trim()){
                return value.trim();
            }

        }

    }

    return null;
}


/* =========================================================
   LOAD NOTIFICATIONS FROM MONGODB
========================================================= */

async function loadNotifications(){

    try{

        const employeeId = getEmployeeId();

        console.log("Employee ID:", employeeId);

        if(!employeeId){

            notifications = [];

            renderNotifications();

            showToast("Employee ID not found. Please login again.");

            return;
        }


        const response = await fetch(
            `${API_BASE}/api/notifications/${encodeURIComponent(employeeId)}`
        );


        if(!response.ok){

            throw new Error(
                "Server returned " + response.status
            );

        }


        const data = await response.json();

        console.log("Notification API Response:", data);


        if(data.success){

            /*
              Backend:
              _id
              title
              message
              type
              isRead
              createdAt
            */

            notifications = (data.notifications || []).map(
                notification => ({

                    id: notification._id,

                    type: notification.type || "general",

                    title: notification.title || "Notification",

                    message: notification.message || "",

                    time:
                        notification.createdAt ||
                        new Date().toISOString(),

                    read:
                        notification.isRead === true,

                    link:
                        notification.link || null

                })
            );

        }
        else{

            notifications = [];

            showToast(
                data.message || "Unable to load notifications"
            );

        }


        renderNotifications();

    }
    catch(error){

        console.error(
            "Notification loading error:",
            error
        );

        notifications = [];

        renderNotifications();

        showToast(
            "Unable to connect to notification server"
        );

    }

}


/* =========================================================
   ICON
========================================================= */

function getIcon(type){

    const icons = {

        task:
            '<i class="bi bi-list-task"></i>',

        leave:
            '<i class="bi bi-calendar2-check-fill"></i>',

        attendance:
            '<i class="bi bi-person-check-fill"></i>',

        payroll:
            '<i class="bi bi-wallet2"></i>',

        profile:
            '<i class="bi bi-person-fill"></i>',

        announcement:
            '<i class="bi bi-megaphone-fill"></i>',

        general:
            '<i class="bi bi-bell-fill"></i>'

    };

    return icons[type] ||
           '<i class="bi bi-bell-fill"></i>';

}


/* =========================================================
   TIME FORMAT
========================================================= */

function timeAgo(date){

    if(!date){
        return "Just now";
    }

    const now = new Date();

    const old = new Date(date);

    const seconds =
        Math.floor(
            (now - old) / 1000
        );


    if(seconds < 60){

        return "Just now";

    }


    const minutes =
        Math.floor(seconds / 60);


    if(minutes < 60){

        return minutes +
            (minutes === 1
                ? " minute ago"
                : " minutes ago");

    }


    const hours =
        Math.floor(minutes / 60);


    if(hours < 24){

        return hours +
            (hours === 1
                ? " hour ago"
                : " hours ago");

    }


    const days =
        Math.floor(hours / 24);


    if(days < 7){

        return days +
            (days === 1
                ? " day ago"
                : " days ago");

    }


    return old.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   RENDER NOTIFICATIONS
========================================================= */

function renderNotifications(){

    const list =
        document.getElementById(
            "notificationList"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const filter =
        document.getElementById(
            "typeFilter"
        ).value;


    let filtered =
        notifications.filter(
            notification => {

                const text =
                    (
                        notification.title +
                        " " +
                        notification.message
                    )
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    text.includes(search);


                const matchesType =
                    filter === "all" ||
                    notification.type === filter;


                return (
                    matchesSearch &&
                    matchesType
                );

            }
        );


    /* Newest first */

    filtered.sort(
        (a,b) =>
            new Date(b.time) -
            new Date(a.time)
    );


    /* Empty */

    if(filtered.length === 0){

        list.innerHTML = "";

        empty.style.display = "block";

    }
    else{

        empty.style.display = "none";


        list.innerHTML =
            filtered.map(
                notification => {

                    const unread =
                        notification.read !== true;


                    return `

                    <div
                        class="notification-item ${unread ? "unread" : ""}"
                        onclick="openNotification('${notification.id}')"
                    >

                        <div
                            class="notification-icon ${notification.type}"
                        >

                            ${getIcon(notification.type)}

                        </div>


                        <div class="notification-content">

                            <div class="notification-title-row">

                                <h6 class="notification-title">

                                    ${escapeHtml(
                                        notification.title
                                    )}

                                </h6>


                                <span
                                    class="type-badge ${notification.type}"
                                >

                                    ${escapeHtml(
                                        notification.type
                                    )}

                                </span>

                            </div>


                            <p class="notification-message">

                                ${escapeHtml(
                                    notification.message
                                )}

                            </p>


                            <div class="notification-time">

                                <i class="bi bi-clock me-1"></i>

                                ${timeAgo(
                                    notification.time
                                )}

                            </div>

                        </div>


                        ${
                            unread
                            ?
                            `<div class="unread-dot"></div>`
                            :
                            ""
                        }

                    </div>

                    `;

                }
            ).join("");

    }


    updateStats();

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(){

    const total =
        notifications.length;


    const unread =
        notifications.filter(
            n => n.read !== true
        ).length;


    const tasks =
        notifications.filter(
            n => n.type === "task"
        ).length;


    const leaves =
        notifications.filter(
            n => n.type === "leave"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent = total;


    document.getElementById(
        "unreadCount"
    ).textContent = unread;


    document.getElementById(
        "taskCount"
    ).textContent = tasks;


    document.getElementById(
        "leaveCount"
    ).textContent = leaves;


    document.getElementById(
        "notificationSummary"
    ).textContent =
        total +
        (
            total === 1
            ? " notification"
            : " notifications"
        );

}


/* =========================================================
   OPEN NOTIFICATION
========================================================= */

async function openNotification(id){

    const notification =
        notifications.find(
            n => String(n.id) === String(id)
        );


    if(!notification) return;


    /* Already read */

    if(notification.read){

        if(notification.link){

            window.location.href =
                notification.link;

        }

        return;

    }


    try{

        const response =
            await fetch(
                `${API_BASE}/api/notifications/${notification.id}/read`,
                {
                    method:"PUT"
                }
            );


        const data =
            await response.json();


        if(data.success){

            notification.read = true;

            renderNotifications();

        }

    }
    catch(error){

        console.error(
            "Mark notification read error:",
            error
        );

    }


    /*
       If backend notification has a link,
       open it.
    */

    if(notification.link){

        setTimeout(
            function(){

                window.location.href =
                    notification.link;

            },
            150
        );

    }

}


/* =========================================================
   MARK ALL READ
========================================================= */

async function markAllRead(){

    const employeeId =
        getEmployeeId();


    if(!employeeId){

        showToast(
            "Employee ID not found"
        );

        return;

    }


    if(notifications.length === 0){

        showToast(
            "No notifications to update"
        );

        return;

    }


    try{

        const response =
            await fetch(
                `${API_BASE}/api/notifications/${encodeURIComponent(employeeId)}/read-all`,
                {
                    method:"PUT"
                }
            );


        const data =
            await response.json();


        if(data.success){

            notifications.forEach(
                notification => {

                    notification.read = true;

                }
            );


            renderNotifications();


            showToast(
                "All notifications marked as read"
            );

        }
        else{

            showToast(
                data.message ||
                "Unable to update notifications"
            );

        }

    }
    catch(error){

        console.error(
            "Mark all read error:",
            error
        );

        showToast(
            "Server connection failed"
        );

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    const text =
        document.getElementById(
            "toastMessage"
        );


    text.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}

    },

document.addEventListener(
