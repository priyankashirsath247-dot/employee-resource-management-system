<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee | ERMS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {

            background:
                linear-gradient(
                    135deg,
                    #020912,
                    #071a2f,
                    #020912
                );

            min-height: 100vh;

            color: white;

        }


        /* NAVBAR */

        .navbar-custom {

            background: rgba(5, 15, 30, 0.9);

            border-bottom:
                1px solid rgba(0, 200, 255, 0.2);

        }


        /* MAIN CARD */

        .employee-card {

            background:
                rgba(10, 24, 43, 0.88);

            border:

                1px solid
                rgba(0, 174, 255, 0.2);

            border-radius: 22px;

            box-shadow:

                0 20px 60px
                rgba(0, 0, 0, 0.45);

            overflow: hidden;

        }


        /* HEADER */

        .card-header-custom {

            background:

                linear-gradient(
                    135deg,
                    #0d6efd,
                    #00c6ff
                );

            padding: 30px;

            text-align: center;

        }


        .card-header-custom i {

            font-size: 45px;

        }


        /* INPUT */

        .form-control {

            background:

                rgba(255,255,255,0.06);

            border:

                1px solid
                rgba(255,255,255,0.12);

            color: white;

            padding: 13px;

            border-radius: 10px;

        }


        .form-control:focus {

            background:

                rgba(255,255,255,0.08);

            color: white;

            border-color:

                #00c6ff;

            box-shadow:

                0 0 0 3px
                rgba(0,198,255,0.15);

        }


        .form-control::placeholder {

            color:

                #8a9ab0;

        }


        .form-label {

            font-weight: 600;

            color:

                #dbeaff;

        }


        /* BUTTON */

        .btn-create {

            background:

                linear-gradient(
                    135deg,
                    #0d6efd,
                    #00c6ff
                );

            border: none;

            padding:

                14px;

            font-weight: 700;

            border-radius: 12px;

            color: white;

            transition: 0.3s;

        }


        .btn-create:hover {

            transform:

                translateY(-2px);

            box-shadow:

                0 10px 25px
                rgba(0,198,255,0.3);

        }


        .employee-icon {

            width: 55px;

            height: 55px;

            background:

                rgba(0,198,255,0.12);

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            color:

                #00c6ff;

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">

    <div class="container">

        <a class="navbar-brand fw-bold">

            <i class="bi bi-shield-lock-fill text-info me-2"></i>

            ERMS Admin Panel

        </a>


        <a
            href="admin-dashboard.html"
            class="btn btn-outline-info btn-sm"
        >

            <i class="bi bi-arrow-left"></i>

            Back Dashboard

        </a>

    </div>

</nav>
<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Add Employee</h2>

    <a href="all-employee.html"
       class="btn btn-outline-light">

        <i class="bi bi-people-fill me-2"></i>
        All Employees

    </a>

</div>


<!-- MAIN -->

<div class="container py-5">


    <div class="row justify-content-center">


        <div class="col-lg-9">


            <div class="employee-card">


                <!-- HEADER -->

                <div class="card-header-custom">

                    <i class="bi bi-person-plus-fill"></i>

                    <h2 class="fw-bold mt-3">

                        Add New Employee

                    </h2>


                    <p class="mb-0">

                        Create employee account and add details

                    </p>

                </div>



                <!-- FORM -->

                <div class="p-4 p-md-5">


                    <form id="employeeForm">


                        <!-- NAME + MOBILE -->

                        <div class="row g-4">


                            <div class="col-md-6">


                                <label class="form-label">

                                    <i class="bi bi-person me-2"></i>

                                    Employee Name

                                </label>


                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter employee name"
                                    required
                                >


                            </div>



                            <div class="col-md-6">


                                <label class="form-label">

                                    <i class="bi bi-phone me-2"></i>

                                    Mobile Number

                                </label>


                                <input
                                    type="tel"
                                    id="mobile"
                                    class="form-control"
                                    placeholder="Enter mobile number"
                                    maxlength="10"
                                    required
                                >


                            </div>


                        </div>



                        <!-- EMAIL -->

                        <div class="row g-4 mt-1">


                            <div class="col-md-6">


                                <label class="form-label">

                                    <i class="bi bi-envelope me-2"></i>

                                    Email Address

                                </label>


                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="employee@gmail.com"
                                    required
                                >


                            </div>



                            <div class="col-md-6">


                                <label class="form-label">

                                    <i class="bi bi-lock me-2"></i>

                                    Password

                                </label>


                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Create password"
                                    required
                                >


                            </div>


                        </div>



                        <!-- DEPARTMENT -->

                        <div class="row g-4 mt-1">


                            <div class="col-md-6">


                                <label class="form-label">

                                    <i class="bi bi-building me-2"></i>

                                    Department

                                </label>


                                <input
                                    type="text"
                                    id="department"
                                    class="form-control"
                                    placeholder="Example: IT"
                                    required
                                >


                            </div>



                            <div class="col-md-6">


                                <label class="form-label">

                                    <i class="bi bi-briefcase me-2"></i>

                                    Position

                                </label>


                                <input
                                    type="text"
                                    id="position"
                                    class="form-control"
                                    placeholder="Example: Manager"
                                    required
                                >


                            </div>


                        </div>



                        <!-- SALARY -->

                        <div class="row mt-4">


                            <div class="col-md-6">


                                <label class="form-label">

                                    <i class="bi bi-currency-rupee me-2"></i>

                                    Salary

                                </label>


                                <input
                                    type="number"
                                    id="salary"
                                    class="form-control"
                                    placeholder="Enter salary"
                                >


                            </div>


                        </div>



                        <!-- BUTTON -->

                        <div class="mt-5">


                            <button
                                type="submit"
                                class="btn btn-create w-100"
                            >

                                <i class="bi bi-person-plus-fill me-2"></i>

                                Create Employee Account

                            </button>


                        </div>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>



<!-- JAVASCRIPT -->

<script>


document
.getElementById("employeeForm")
.addEventListener(
    "submit",
    async function(e)
    {


        e.preventDefault();


        const employeeId =

            "EMP" +

            Date.now();



        const employeeData = {


            employeeId:

                employeeId,


            name:

                document
                .getElementById("name")
                .value
                .trim(),


            mobile:

                document
                .getElementById("mobile")
                .value
                .trim(),


            email:

                document
                .getElementById("email")
                .value
                .trim(),


            password:

                document
                .getElementById("password")
                .value
                .trim(),


            department:

                document
                .getElementById("department")
                .value
                .trim(),


            position:

                document
                .getElementById("position")
                .value
                .trim(),


            salary:

                document
                .getElementById("salary")
                .value || 0


        };



        try {


            const response =

                await fetch(
                    "/api/employees",
                    {


                        method:

                            "POST",


                        headers:
                        {

                            "Content-Type":

                                "application/json"

                        },


                        body:

                            JSON.stringify(
                                employeeData
                            )


                    }
                );



            const result =

                await response.json();



            if (result.success) {


                alert(
                    "Employee Created Successfully!"
                );


                document
                .getElementById(
                    "employeeForm"
                )
                .reset();


            }

            else {


                alert(
                    result.message
                );


            }


        }


        catch(error) {


            console.error(error);


            alert(
                "Server Error! Employee not created."
            );


        }


    }
);


</script>


<!-- Bootstrap JS -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
