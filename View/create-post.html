<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Post – Resource Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .container-box {
            max-width: 700px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-title {
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn-submit {
            background-color: #0d6efd;
            color: white;
        }
        .btn-submit:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="container-box">

    <h3 class="form-title">📝 Create New Post (Resource Management System)</h3>

    <!-- Form Start -->
    <form action="submit-post.php" method="POST" enctype="multipart/form-data">

        <!-- Post Title -->
        <div class="mb-3">
            <label class="form-label">Post Title</label>
            <input type="text" name="post_title" class="form-control" placeholder="Enter Post Title" required>
        </div>

        <!-- Category -->
        <div class="mb-3">
            <label class="form-label">Resource Category</label>
            <select name="category" class="form-select" required>
                <option value="">Select Category</option>
                <option>Human Resource</option>
                <option>Finance</option>
                <option>Assets / Inventory</option>
                <option>Project Updates</option>
                <option>Information Notice</option>
            </select>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label class="form-label">Post Description</label>
            <textarea name="description" class="form-control" rows="5" placeholder="Type details..." required></textarea>
        </div>

        <!-- File Upload -->
        <div class="mb-3">
            <label class="form-label">Attach File (Optional)</label>
            <input type="file" name="attachment" class="form-control">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-submit w-100">Create Post</button>

    </form>
    <!-- Form End -->

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
