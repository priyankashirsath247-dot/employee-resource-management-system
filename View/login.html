<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>HRMS Login | Resource Management System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    rgba(2, 6, 18, 0.84),
                    rgba(5, 8, 20, 0.97)
                ),
                url("/img/attendance-bg.jpg")
                center center / cover no-repeat fixed;

            color: #ffffff;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;

            width: 600px;
            height: 600px;

            left: -230px;
            top: -230px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(13, 110, 253, 0.24),
                    transparent 70%
                );

            filter: blur(65px);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;

            width: 520px;
            height: 520px;

            right: -200px;
            bottom: -220px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(102, 16, 242, 0.23),
                    transparent 70%
                );

            filter: blur(65px);
            pointer-events: none;
            z-index: 0;
        }

        /* LOGIN BOX */

        .login-box {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 410px;

            padding: 30px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.95),
                    rgba(5, 10, 23, 0.97)
                );

            border:
                1px solid rgba(255, 255, 255, 0.11);

            box-shadow:
                0 0 35px rgba(13, 110, 253, 0.16),
                0 25px 70px rgba(0, 0, 0, 0.68);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        /* BRAND */

        .brand-icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 11px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 16px;

            font-size: 25px;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #6610f2
                );

            box-shadow:
                0 10px 30px rgba(13, 110, 253, 0.28);
        }

        .brand-title {
            margin: 0;

            font-size: 23px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .brand-subtitle {
            color: #94a3b8;
            font-size: 12px;
            margin: 4px 0 21px;
        }

        /* LABEL */

        .form-label {
            margin-bottom: 6px;

            color: #cbd5e1;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        /* INPUT */

        .form-control,
        .form-select {
            height: 43px;

            padding: 8px 12px;

            border-radius: 10px !important;

            background:
                rgba(15, 23, 42, 0.90) !important;

            border:
                1px solid rgba(148, 163, 184, 0.20) !important;

            color: #ffffff !important;

            font-size: 12px;

            box-shadow: none !important;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .form-control::placeholder {
            color: #64748b !important;
        }

        .form-control:hover,
        .form-select:hover {
            border-color:
                rgba(99, 102, 241, 0.40) !important;
        }

        .form-control:focus,
        .form-select:focus {
            border-color:
                #6366f1 !important;

            background:
                rgba(15, 23, 42, 0.98) !important;

            box-shadow:
                0 0 0 3px
                rgba(99, 102, 241, 0.13) !important;
        }

        .form-select option {
            background: #0f172a;
            color: #ffffff;
        }

        /* PASSWORD */

        .eye-toggle {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            cursor: pointer;

            font-size: 16px;

            z-index: 5;

            opacity: 0.75;

            user-select: none;
        }

        .eye-toggle:hover {
            opacity: 1;
        }

        /* FORGOT */

        .forgot-link {
            color: #818cf8 !important;

            font-size: 13px;

            text-decoration: none;

            font-weight: 600;
        }

        .forgot-link:hover {
            color: #a5b4fc !important;
            text-decoration: underline;
        }

        /* LOGIN BUTTON */

        .login-btn {
            height: 44px;

            border: none;
            border-radius: 11px;

            padding: 8px 13px;

            font-size: 12px;
            font-weight: 800;

            transition: 0.25s ease;

            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.22);
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 28px
                rgba(0, 0, 0, 0.32);
        }

        .login-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary.login-btn {
            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #6610f2
                );
        }

        .btn-success.login-btn {
            background:
                linear-gradient(
                    135deg,
                    #198754,
                    #20c997
                );
        }

        /* CREATE */

        .create-btn {
            display: block;

            width: 100%;

            text-align: center;

            padding: 10px 12px;

            margin-top: 13px;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    rgba(13, 110, 253, 0.11),
                    rgba(102, 16, 242, 0.11)
                );

            border:
                1px solid
                rgba(99, 102, 241, 0.25);

            color: #a5b4fc;

            font-size: 13px;

            font-weight: 700;

            text-decoration: none;

            transition: 0.25s ease;
        }

        .create-btn:hover {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    rgba(13, 110, 253, 0.22),
                    rgba(102, 16, 242, 0.22)
                );

            transform: translateY(-2px);
        }

        /* MESSAGES */

        .loading {
            display: none;
        }

        .success-message {
            display: none;

            padding: 10px 12px;

            margin-bottom: 13px;

            border-radius: 10px;

            background:
                rgba(25, 135, 84, 0.12);

            border:
                1px solid rgba(25, 135, 84, 0.35);

            color: #75e6a5;

            font-size: 12px;

            line-height: 1.5;
        }

        .error-message {
            display: none;

            padding: 10px 12px;

            margin-bottom: 13px;

            border-radius: 10px;

            background:
                rgba(220, 53, 69, 0.12);

            border:
                1px solid rgba(220, 53, 69, 0.35);

            color: #ff8d98;

            font-size: 12px;

            line-height: 1.5;
        }

        hr {
            border-color:
                rgba(255, 255, 255, 0.10) !important;

            margin:
                18px 0 !important;
        }

        .login-section {
            animation:
                fadeIn 0.25s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MODAL */

        .modal-content {
            border-radius: 16px !important;

            background:
                rgba(10, 16, 30, 0.98) !important;

            border:
                1px solid
                rgba(255, 255, 255, 0.10) !important;
        }

        .modal-header,
        .modal-footer {
            border-color:
                rgba(255, 255, 255, 0.10) !important;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 12px;
                background-attachment: scroll;
            }

            .login-box {
                max-width: 100%;
                padding: 21px;
                border-radius: 18px;
            }

            .brand-icon {
                width: 54px;
                height: 54px;
                font-size: 22px;
            }

            .brand-title {
                font-size: 20px;
            }

            .form-control,
            .form-select {
                height: 40px;
                font-size: 13px;
            }

            .login-btn {
                height: 41px;
            }
        }

    </style>

</head>

<body>

<div class="login-box">

    <!-- BRAND -->

    <div class="brand-icon">
        👨‍💼
    </div>

    <h3 class="text-center text-primary brand-title">
        HRMS Login
    </h3>

    <p class="text-center brand-subtitle">
        Resource Management System
    </p>


    <!-- ROLE -->

    <div class="mb-3">

        <label class="form-label">
            Select Portal
        </label>

        <select
            id="roleSelect"
            class="form-select">

            <option value="admin">
                Admin Portal
            </option>

            <option value="employee">
                Employee Portal
            </option>

        </select>

    </div>


    <!-- SUCCESS -->

    <div
        id="successMessage"
        class="success-message">
    </div>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="error-message">
    </div>


    <!-- ================= ADMIN ================= -->

    <div
        id="adminSection"
        class="login-section">

        <form
            onsubmit="return loginAdmin(event)"
            autocomplete="off">

            <label class="form-label">
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                class="form-control mb-3"
                placeholder="Enter admin email"
                autocomplete="off"
                required>


            <label class="form-label">
                Password
            </label>

            <div class="position-relative mb-2">

                <input
                    type="password"
                    id="adminPass"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required>

                <span
                    class="eye-toggle"
                    onclick="togglePass('adminPass', this)">
                    👁️
                </span>

            </div>


            <div class="text-end mb-3">

                <a
                    href="#"
                    class="forgot-link"
                    data-bs-toggle="modal"
                    data-bs-target="#forgotModal">

                    Forgot Password?

                </a>

            </div>


            <button
                type="submit"
                id="adminLoginBtn"
                class="btn btn-primary w-100 login-btn">

                <span id="adminNormalText">
                    Login as Admin
                </span>

                <span
                    id="adminLoading"
                    class="loading">

                    Logging in...

                </span>

            </button>

        </form>

    </div>


    <!-- ================= EMPLOYEE ================= -->

    <div
        id="employeeSection"
        class="login-section"
        style="display:none;">

        <form
            onsubmit="return loginEmployee(event)"
            autocomplete="off">

            <label class="form-label">
                Employee Email
            </label>

            <input
                type="email"
                id="empEmail"
                class="form-control mb-3"
                placeholder="Enter employee email"
                autocomplete="off"
                required>


            <label class="form-label">
                Password
            </label>

            <div class="position-relative mb-2">

                <input
                    type="password"
                    id="employeePass"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required>

                <span
                    class="eye-toggle"
                    onclick="togglePass('employeePass', this)">
                    👁️
                </span>

            </div>


            <div class="text-end mb-3">

                <a
                    href="#"
                    class="forgot-link"
                    data-bs-toggle="modal"
                    data-bs-target="#forgotModal">

                    Forgot Password?

                </a>

            </div>


            <button
                type="submit"
                id="employeeLoginBtn"
                class="btn btn-success w-100 login-btn">

                <span id="employeeNormalText">
                    Login as Employee
                </span>

                <span
                    id="employeeLoading"
                    class="loading">

                    Logging in...

                </span>

            </button>

        </form>

    </div>


    <hr>


    <a
        href="create.html"
        class="create-btn">

        ✨ Create New Account

    </a>

</div>


<!-- ================= FORGOT PASSWORD ================= -->

<div
    class="modal fade"
    id="forgotModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content text-white">

            <div class="modal-header">

                <h5 class="modal-title">
                    Reset Password
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <label class="form-label">
                    Select Role
                </label>

                <select
                    id="fpRole"
                    class="form-select mb-3">

                    <option value="admin">
                        Admin
                    </option>

                    <option value="employee">
                        Employee
                    </option>

                </select>


                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    id="fpEmail"
                    class="form-control mb-3"
                    placeholder="Enter email">


                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    id="fpPass"
                    class="form-control"
                    placeholder="Enter new password">

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-primary w-100"
                    onclick="resetPassword()">

                    Update Password

                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


<script>

/* =====================================================
   PASSWORD TOGGLE
===================================================== */

function togglePass(id, icon) {

    const input = document.getElementById(id);

    if (!input) return;

    if (input.type === "password") {

        input.type = "text";
        icon.innerText = "🙈";

    } else {

        input.type = "password";
        icon.innerText = "👁️";

    }
}


/* =====================================================
   ROLE SWITCH
===================================================== */

document
    .getElementById("roleSelect")
    .addEventListener("change", function () {

        const adminSection =
            document.getElementById("adminSection");

        const employeeSection =
            document.getElementById("employeeSection");

        clearMessages();

        if (this.value === "admin") {

            adminSection.style.display = "block";
            employeeSection.style.display = "none";

        } else {

            adminSection.style.display = "none";
            employeeSection.style.display = "block";

        }

    });


/* =====================================================
   MESSAGE FUNCTIONS
===================================================== */

function clearMessages() {

    const success =
        document.getElementById("successMessage");

    const error =
        document.getElementById("errorMessage");

    success.style.display = "none";
    error.style.display = "none";

    success.innerHTML = "";
    error.innerHTML = "";
}


function showSuccess(message) {

    const box =
        document.getElementById("successMessage");

    const error =
        document.getElementById("errorMessage");

    error.style.display = "none";

    box.innerHTML = "✅ " + message;
    box.style.display = "block";
}


function showError(message) {

    const box =
        document.getElementById("errorMessage");

    const success =
        document.getElementById("successMessage");

    success.style.display = "none";

    box.innerHTML = "⚠️ " + message;
    box.style.display = "block";
}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function loginAdmin(event) {

    event.preventDefault();

    clearMessages();

    const email =
        document
            .getElementById("adminEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("adminPass")
            .value;

    const button =
        document.getElementById("adminLoginBtn");

    const normalText =
        document.getElementById("adminNormalText");

    const loading =
        document.getElementById("adminLoading");

    button.disabled = true;

    normalText.style.display = "none";
    loading.style.display = "inline";

    try {

        const response =
            await fetch("/adminLogin", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Invalid Admin Login"
            );

        }


        /* CLEAR EMPLOYEE SESSION */

        localStorage.removeItem("employeeId");
        localStorage.removeItem("employeeName");
        localStorage.removeItem("employeeData");
        localStorage.removeItem("loggedInEmployee");
        localStorage.removeItem("erms_user");


        /* SAVE ADMIN */

        localStorage.setItem(
            "loggedInAdmin",
            JSON.stringify(
                data.admin ||
                data.user ||
                data.data ||
                {}
            )
        );

        localStorage.setItem(
            "erms_role",
            "admin"
        );


        showSuccess(
            "Admin login successful. Opening dashboard..."
        );


        setTimeout(() => {

            window.location.href =
                "/admin-dashboard.html";

        }, 600);


    } catch (error) {

        console.error(
            "ADMIN LOGIN ERROR:",
            error
        );

        showError(
            error.message ||
            "Server connection failed."
        );


    } finally {

        button.disabled = false;

        normalText.style.display = "inline";
        loading.style.display = "none";

    }

    return false;
}


/* =====================================================
   EMPLOYEE LOGIN
===================================================== */

async function loginEmployee(event) {

    event.preventDefault();

    clearMessages();

    const email =
        document
            .getElementById("empEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("employeePass")
            .value;

    const button =
        document.getElementById(
            "employeeLoginBtn"
        );

    const normalText =
        document.getElementById(
            "employeeNormalText"
        );

    const loading =
        document.getElementById(
            "employeeLoading"
        );

    button.disabled = true;

    normalText.style.display = "none";
    loading.style.display = "inline";


    try {

        console.log(
            "Employee login request:",
            email
        );


        const response =
            await fetch("/employeeLogin", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",
                    "Accept":
                        "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    password: password

                })

            });


        let data;

        try {

            data = await response.json();

        } catch (jsonError) {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        console.log(
            "Employee Login Response:",
            data
        );


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Invalid employee email or password."
            );

        }


        /* =================================================
           GET EMPLOYEE OBJECT
        ================================================= */

        const employee =
            data.employee ||
            data.user ||
            data.data ||
            {};


        console.log(
            "Employee:",
            employee
        );


        /* =================================================
           GET EMPLOYEE ID
        ================================================= */

        const employeeId =
            employee.employeeId ||
            employee.empId ||
            employee.employeeID ||
            employee.id ||
            data.employeeId ||
            data.empId ||
            "";


        /* =================================================
           GET EMPLOYEE NAME
        ================================================= */

        const employeeName =
            employee.name ||
            employee.employeeName ||
            employee.fullName ||
            employee.username ||
            "Employee";


        if (!employeeId) {

            console.error(
                "Employee object:",
                employee
            );

            throw new Error(
                "Employee ID was not received from server."
            );

        }


        /* =================================================
           CLEAR ADMIN SESSION
        ================================================= */

        localStorage.removeItem(
            "loggedInAdmin"
        );


        localStorage.removeItem(
            "erms_role"
        );


        localStorage.removeItem(
            "loggedInEmployee"
        );


        localStorage.removeItem(
            "employeeId"
        );


        localStorage.removeItem(
            "employeeName"
        );


        localStorage.removeItem(
            "employeeData"
        );


        localStorage.removeItem(
            "erms_user"
        );


        /* =================================================
           SAVE EMPLOYEE SESSION
        ================================================= */

        localStorage.setItem(
            "employeeId",
            String(employeeId)
        );


        localStorage.setItem(
            "employeeName",
            String(employeeName)
        );


        localStorage.setItem(
            "employeeData",
            JSON.stringify(employee)
        );


        localStorage.setItem(
            "loggedInEmployee",
            JSON.stringify(employee)
        );


        localStorage.setItem(
            "erms_user",
            JSON.stringify(employee)
        );


        localStorage.setItem(
            "erms_role",
            "employee"
        );


        console.log(
            "================================="
        );

        console.log(
            "EMPLOYEE LOGIN SUCCESS"
        );

        console.log(
            "Employee ID:",
            employeeId
        );

        console.log(
            "Employee Name:",
            employeeName
        );

        console.log(
            "================================="
        );


        /* =================================================
           SUCCESS
        ================================================= */

        showSuccess(
            "Welcome " +
            employeeName +
            "! Opening your dashboard..."
        );


        /* =================================================
           DASHBOARD
        ================================================= */

        setTimeout(() => {

            window.location.href =
                "/employee-dashboard.html";

        }, 600);


    } catch (error) {

        console.error(
            "EMPLOYEE LOGIN ERROR:",
            error
        );

        showError(
            error.message ||
            "Employee login failed."
        );


    } finally {

        button.disabled = false;

        normalText.style.display = "inline";

        loading.style.display = "none";

    }

    return false;
}


/* =====================================================
   RESET PASSWORD
===================================================== */

async function resetPassword() {

    const role =
        document.getElementById(
            "fpRole"
        ).value;

    const email =
        document.getElementById(
            "fpEmail"
        ).value
        .trim();

    const password =
        document.getElementById(
            "fpPass"
        ).value;


    if (!email || !password) {

        alert(
            "Please enter email and new password."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/resetPassword",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        role: role,

                        email: email,

                        password: password

                    })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            alert(
                "Password updated successfully."
            );


            const modalElement =
                document.getElementById(
                    "forgotModal"
                );


            const modal =
                bootstrap.Modal.getInstance(
                    modalElement
                );


            if (modal) {
                modal.hide();
            }


            document.getElementById(
                "fpEmail"
            ).value = "";


            document.getElementById(
                "fpPass"
            ).value = "";


        } else {

            alert(
                data.message ||
                "Password reset failed."
            );

        }


    } catch (error) {

        console.error(
            "Reset Password Error:",
            error
        );

        alert(
            "Server Connection Failed"
        );

    }

}
