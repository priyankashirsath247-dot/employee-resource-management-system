<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tasks | ELITE ERMS</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Inter",sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}


/* ================= TOPBAR ================= */

.topbar{
    height:68px;
    background:#fff;
    border-bottom:1px solid #e5eaf1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:1000;
}

.left-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-btn{
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid #dce3ec;
    background:#fff;
    font-size:19px;
    color:#26364d;
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-box{
    width:230px;
    height:40px;
    background:#f7f9fc;
    border:1px solid #e3e9f1;
    border-radius:22px;
    display:flex;
    align-items:center;
    padding:0 14px;
    color:#94a3b8;
}

.search-box i{
    font-size:16px;
    margin-right:8px;
}

.search-box input{
    border:none;
    outline:none;
    background:transparent;
    width:100%;
    font-size:13px;
}


/* ================= PROFILE ================= */

.profile-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-circle{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#f7f9fc;
    border:1px solid #e3e9f1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:#334155;
    position:relative;
}

.notification-badge{
    position:absolute;
    right:-2px;
    top:-3px;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#ff4d5e;
    color:#fff;
    font-size:9px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile{
    display:flex;
    align-items:center;
    gap:9px;
    background:#f7f9fc;
    border:1px solid #e1e7ef;
    border-radius:28px;
    padding:5px 11px 5px 5px;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg,#2186ff,#6c63ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:14px;
}

.profile-name{
    font-size:12px;
    font-weight:700;
}

.profile-email{
    font-size:10px;
    color:#94a3b8;
}


/* ================= MAIN ================= */

.main{
    padding:26px 24px;
    max-width:1500px;
    margin:auto;
}

.heading-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.heading h1{
    font-size:27px;
    font-weight:800;
    margin:0;
    color:#17233b;
}

.heading p{
    margin:5px 0 0;
    color:#7890aa;
    font-size:12px;
}

.date-box{
    background:white;
    border:1px solid #e3e9f1;
    padding:9px 13px;
    border-radius:10px;
    color:#52657e;
    font-size:11px;
    white-space:nowrap;
}


/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat-card{
    background:#fff;
    border:1px solid #e5eaf1;
    border-radius:13px;
    padding:14px 15px;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:0 5px 16px rgba(20,40,70,.035);
}

.stat-icon{
    width:40px;
    height:40px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
}

.blue{
    background:#e7f1ff;
    color:#1677ff;
}

.orange{
    background:#fff1db;
    color:#f59e0b;
}

.purple{
    background:#eee9ff;
    color:#7357ff;
}

.green{
    background:#def8ef;
    color:#10a878;
}

.stat-label{
    color:#8a9aaf;
    font-size:10px;
    margin-bottom:2px;
}

.stat-number{
    font-size:19px;
    font-weight:800;
    color:#1d2b42;
}


/* ================= TOOLBAR ================= */

.toolbar{
    background:#fff;
    border:1px solid #e3e9f1;
    border-radius:13px;
    padding:10px;
    display:flex;
    gap:9px;
    margin-bottom:17px;
}

.toolbar input,
.toolbar select{
    border:1px solid #dce4ee;
    border-radius:9px;
    padding:8px 10px;
    outline:none;
    color:#475569;
    background:#fbfcfe;
    font-size:12px;
    height:38px;
}

.toolbar input{
    flex:1;
}

.toolbar input:focus,
.toolbar select:focus{
    border-color:#7aa7ff;
    box-shadow:0 0 0 2px rgba(22,119,255,.08);
}


/* ================= TASK GRID ================= */

.task-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.task-card{
    background:#fff;
    border:1px solid #e1e8f0;
    border-radius:15px;
    padding:16px;
    box-shadow:0 6px 20px rgba(20,40,70,.045);
    transition:.2s;
    position:relative;
    overflow:hidden;
}

.task-card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(30,70,120,.09);
    border-color:#b8d0ff;
}

.task-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:4px;
    height:100%;
    background:linear-gradient(180deg,#1677ff,#7157ff);
}


/* ================= TASK TOP ================= */

.task-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.task-id{
    background:#e7f1ff;
    color:#1677ff;
    font-weight:700;
    font-size:9px;
    padding:5px 8px;
    border-radius:6px;
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.priority{
    padding:5px 8px;
    border-radius:6px;
    font-size:9px;
    font-weight:700;
}

.priority-Urgent{
    background:#ffe4e7;
    color:#f04452;
}

.priority-High{
    background:#fff0d7;
    color:#e99800;
}

.priority-Medium{
    background:#e9efff;
    color:#526cff;
}

.priority-Low{
    background:#e5f8ef;
    color:#0b9b6c;
}


/* ================= TASK CONTENT ================= */

.task-title{
    font-size:16px;
    font-weight:750;
    margin:12px 0 6px;
    color:#243047;
    line-height:1.3;
}

.task-description{
    color:#7c8999;
    font-size:11px;
    line-height:1.5;
    min-height:48px;
    max-height:50px;
    overflow:hidden;
}


/* ================= DATES ================= */

.dates{
    border:1px solid #dce4ec;
    border-radius:9px;
    padding:8px 10px;
    margin-top:12px;
    background:#fcfdff;
}

.date-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:10px;
    margin:3px 0;
}

.date-label{
    color:#718096;
}

.normal-date{
    color:#34435b;
    font-weight:600;
}

.due{
    color:#f04452;
    font-weight:700;
}


/* ================= TASK BOTTOM ================= */

.task-bottom{
    border-top:1px solid #e3e8ee;
    margin-top:12px;
    padding-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.status{
    padding:5px 9px;
    border-radius:20px;
    font-size:9px;
    font-weight:700;
}

.status-assigned{
    background:#e8f1ff;
    color:#1476ed;
}

.status-progress{
    background:#fff1d8;
    color:#d88b00;
}

.status-completed{
    background:#daf7ec;
    color:#0b9c6a;
}

.comment-btn{
    width:34px;
    height:34px;
    border-radius:9px;
    border:1px solid #dbe2ea;
    background:#fff;
    color:#43536a;
    transition:.2s;
    font-size:14px;
}

.comment-btn:hover{
    background:#1677ff;
    color:#fff;
    border-color:#1677ff;
    transform:scale(1.05);
}

.comment-count{
    font-size:9px;
    color:#7b8797;
    margin-right:5px;
}


/* ================= EMPTY ================= */

.empty-state{
    background:#fff;
    border-radius:15px;
    padding:45px 20px;
    text-align:center;
    border:1px solid #e1e8f0;
    grid-column:1/-1;
}

.empty-state i{
    font-size:40px;
    color:#aebbd0;
}


/* ================= MODAL ================= */

.modal-content{
    border:none;
    border-radius:17px;
    overflow:hidden;
}

.modal-header{
    padding:16px 20px;
    border-bottom:1px solid #e7ebf0;
}

.modal-title{
    font-weight:800;
    font-size:17px;
    color:#243047;
}

.modal-header small{
    font-size:11px;
}

.modal-body{
    padding:20px;
}

.modal-task-title{
    font-size:17px;
    font-weight:750;
    margin-bottom:6px;
}

.modal-description{
    color:#7b8797;
    line-height:1.5;
    font-size:12px;
}

.comment-label{
    font-weight:700;
    color:#29374c;
    margin-bottom:7px;
    font-size:12px;
}

.comment-box{
    width:100%;
    min-height:105px;
    border:1px solid #d9e1eb;
    border-radius:10px;
    padding:11px;
    resize:vertical;
    outline:none;
    font-size:12px;
}

.comment-box:focus{
    border-color:#5b8def;
    box-shadow:0 0 0 3px rgba(91,141,239,.10);
}

.submit-btn{
    border:none;
    background:linear-gradient(135deg,#1677ff,#635bff);
    color:#fff;
    padding:9px 15px;
    border-radius:9px;
    font-weight:700;
    font-size:12px;
}

.submit-btn:hover{
    opacity:.92;
}

.comment-message{
    font-size:11px;
    font-weight:600;
}


/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

    .task-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .topbar{
        height:62px;
        padding:0 12px;
    }

    .search-box{
        display:none;
    }

    .profile-email{
        display:none;
    }

    .profile{
        padding:4px 8px 4px 4px;
    }

    .profile-name{
        font-size:11px;
    }

    .main{
        padding:20px 12px;
    }

    .heading-row{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
        margin-bottom:16px;
    }

    .heading h1{
        font-size:23px;
    }

    .heading p{
        font-size:11px;
    }

    .task-grid,
    .stats{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
    }

    .toolbar input,
    .toolbar select{
        width:100%;
    }

}



</style>

</head>


<body>


<!-- ================= TOPBAR ================= -->

<header class="topbar">

    <div class="left-top">

        <button class="menu-btn">
            <i class="bi bi-list"></i>
        </button>

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search resources, tasks...">

        </div>

    </div>


    <div class="profile-area">

        <div class="icon-circle">

            <i class="bi bi-moon-stars"></i>

        </div>


        <div class="icon-circle">

            <i class="bi bi-bell"></i>

            <span class="notification-badge">
                6
            </span>

        </div>


        <div class="profile">

            <div
                class="avatar"
                id="avatar">
                E
            </div>

            <div>

                <div
                    class="profile-name"
                    id="employeeName">
                    Employee
                </div>

                <div
                    class="profile-email"
                    id="employeeEmail">
                    employee@erms.com
                </div>

            </div>

            <i class="bi bi-chevron-down ms-2"></i>

        </div>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="main">


    <div class="heading-row">

        <div class="heading">

            <h1>
                My Assigned Tasks
            </h1>

            <p>
                View your assigned work, track progress and send updates to admin.
            </p>

        </div>


        <div class="date-box">

            <i class="bi bi-calendar3 me-2"></i>

            <span id="todayDate"></span>

        </div>

    </div>



    <!-- ================= STATS ================= -->

    <div class="stats">


        <div class="stat-card">

            <div class="stat-icon blue">

                <i class="bi bi-list-task"></i>

            </div>

            <div>

                <div class="stat-label">
                    Total Tasks
                </div>

                <div
                    class="stat-number"
                    id="totalTasks">
                    0
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon orange">

                <i class="bi bi-hourglass-split"></i>

            </div>

            <div>

                <div class="stat-label">
                    Pending
                </div>

                <div
                    class="stat-number"
                    id="pendingTasks">
                    0
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon purple">

                <i class="bi bi-arrow-repeat"></i>

            </div>

            <div>

                <div class="stat-label">
                    In Progress
                </div>

                <div
                    class="stat-number"
                    id="progressTasks">
                    0
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon green">

                <i class="bi bi-check2-circle"></i>

            </div>

            <div>

                <div class="stat-label">
                    Completed
                </div>

                <div
                    class="stat-number"
                    id="completedTasks">
                    0
                </div>

            </div>

        </div>

    </div>



    <!-- ================= FILTER ================= -->

    <div class="toolbar">

        <input
            type="text"
            id="taskSearch"
            placeholder="Search my tasks...">


        <select id="statusFilter">

            <option value="all">
                All Status
            </option>

            <option value="Assigned">
                Assigned
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Completed">
                Completed
            </option>

        </select>


        <select id="priorityFilter">

            <option value="all">
                All Priority
            </option>

            <option value="Urgent">
                Urgent
            </option>

            <option value="High">
                High
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="Low">
                Low
            </option>

        </select>

    </div>



    <!-- ================= TASK CONTAINER ================= -->

    <div
        class="task-grid"
        id="taskContainer">
    </div>


</main>



<!-- =====================================================
     COMMENT MODAL
====================================================== -->

<div
    class="modal fade"
    id="commentModal"
    tabindex="-1"
    aria-hidden="true">


    <div class="modal-dialog modal-dialog-centered">


        <div class="modal-content">


            <div class="modal-header">

                <div>

                    <h5 class="modal-title">

                        <i class="bi bi-chat-square-text me-2"></i>

                        Add Progress Comment

                    </h5>

                    <small class="text-muted">

                        Send an update directly to Admin

                    </small>

                </div>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>



            <div class="modal-body">


                <!-- TASK INFO -->

                <div
                    class="modal-task-title"
                    id="modalTaskTitle">
                    Task
                </div>


                <div
                    class="modal-description mb-4"
                    id="modalTaskDescription">
                </div>



                <!-- COMMENT -->

                <div class="mb-3">

                    <div class="comment-label">

                        <i class="bi bi-chat-left-text me-1"></i>

                        Your Progress / Comment

                    </div>


                    <textarea
                        id="taskComment"
                        class="comment-box"
                        placeholder="Describe your progress, completed work, issue, or deliverable URL...">
                    </textarea>

                </div>


                <div
                    id="commentMessage"
                    class="comment-message mb-3">
                </div>


                <div class="d-flex justify-content-end">

                    <button
                        class="submit-btn"
                        id="submitCommentBtn"
                        onclick="submitTaskComment()">

                        <i class="bi bi-send me-1"></i>

                        Send to Admin

                    </button>

            </div>

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<script>

/* =====================================================
   VARIABLES
===================================================== */

let myTasks = [];

let selectedTaskId = null;


/* =====================================================
   EMPLOYEE INFO
===================================================== */

const employeeId =
    localStorage.getItem("employeeId");

const employeeName =
    localStorage.getItem("employeeName") ||
    "Employee";

const employeeEmail =
    localStorage.getItem("employeeEmail") ||
    "employee@erms.com";


document.getElementById("employeeName")
    .textContent = employeeName;


document.getElementById("employeeEmail")
    .textContent = employeeEmail;


document.getElementById("avatar")
    .textContent =
        employeeName.charAt(0).toUpperCase();



/* =====================================================
   TODAY DATE
===================================================== */

document.getElementById("todayDate")
    .textContent =
        new Date().toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );



/* =====================================================
   LOAD EMPLOYEE TASKS
===================================================== */

async function loadMyTasks(){

    const container =
        document.getElementById("taskContainer");


    if(!employeeId){

        container.innerHTML = `

            <div class="empty-state">

                <i class="bi bi-person-x"></i>

                <h4 class="mt-3">
                    Employee ID Not Found
                </h4>

                <p class="text-muted">
                    Please login again to view your tasks.
                </p>

            </div>

        `;

        return;
    }


    try{

        const response =
            await fetch(
                `/api/task/employee/${encodeURIComponent(employeeId)}`
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Unable to load tasks"
            );

        }


        myTasks =
            data.tasks || [];


        updateStats();

        renderTasks();

    }


    catch(error){

        console.error(
            "Load Task Error:",
            error
        );


        container.innerHTML = `

            <div class="empty-state">

                <i class="bi bi-exclamation-circle"></i>

                <h4 class="mt-3">
                    Unable to Load Tasks
                </h4>

                <p class="text-muted">
                    Please make sure Node.js server is running.
                </p>

            </div>

        `;

    }

}



/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

    document.getElementById("totalTasks")
        .textContent =
            myTasks.length;


    document.getElementById("pendingTasks")
        .textContent =
            myTasks.filter(
                t =>
                    (t.status || "Assigned")
                    === "Assigned"
            ).length;


    document.getElementById("progressTasks")
        .textContent =
            myTasks.filter(
                t =>
                    t.status === "In Progress"
            ).length;


    document.getElementById("completedTasks")
        .textContent =
            myTasks.filter(
                t =>
                    t.status === "Completed"
            ).length;

}



/* =====================================================
   RENDER TASKS
===================================================== */

function renderTasks(){

    const container =
        document.getElementById("taskContainer");


    const search =
        document.getElementById("taskSearch")
            .value
            .toLowerCase()
            .trim();


    const status =
        document.getElementById("statusFilter")
            .value;


    const priority =
        document.getElementById("priorityFilter")
            .value;


    const filtered =
        myTasks.filter(task => {

            const taskStatus =
                task.status ||
                "Assigned";


            const matchesSearch =

                (task.taskTitle || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (task.description || "")
                    .toLowerCase()
                    .includes(search);


            const matchesStatus =
                status === "all" ||
                taskStatus === status;


            const matchesPriority =
                priority === "all" ||
                task.priority === priority;


            return (
                matchesSearch &&
                matchesStatus &&
                matchesPriority
            );

        });



    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty-state">

                <i class="bi bi-clipboard-x"></i>

                <h4 class="mt-3">
                    No Tasks Found
                </h4>

                <p class="text-muted">
                    You don't have any matching tasks.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered
            .map(createTaskCard)
            .join("");

}



/* =====================================================
   CREATE TASK CARD
===================================================== */

function createTaskCard(task){

    const status =
        task.status ||
        "Assigned";


    let statusClass =
        "status-assigned";


    if(status === "In Progress")
        statusClass =
            "status-progress";


    if(status === "Completed")
        statusClass =
            "status-completed";


    const priority =
        task.priority ||
        "Medium";


    const taskId =
        task.taskId ||
        task._id ||
        "TASK";


    const commentCount =
        task.comments?.length || 0;


    return `

        <div class="task-card">


            <div class="task-top">

                <span class="task-id">

                    ${escapeHtml(taskId)}

                </span>


                <span class="priority priority-${escapeHtml(priority)}">

                    ${escapeHtml(priority)}

                </span>

            </div>



            <div class="task-title">

                ${escapeHtml(
                    task.taskTitle ||
                    "Untitled Task"
                )}

            </div>



            <div class="task-description">

                ${escapeHtml(
                    task.description ||
                    "No description provided."
                )}

            </div>



            <div class="dates">


                <div class="date-row">

                    <span class="date-label">
                        Start Date
                    </span>

                    <span class="normal-date">

                        ${formatDate(
                            task.startDate
                        )}

                    </span>

                </div>



                <div class="date-row">

                    <span class="date-label">
                        Due Date
                    </span>

                    <span class="due">

                        ${formatDate(
                            task.dueDate
                        )}

                    </span>

                </div>


            </div>



            <div class="task-bottom">


                <span class="status ${statusClass}">

                    <i class="bi bi-check2-circle me-1"></i>

                    ${escapeHtml(status)}

                </span>



                <div>

                    ${
                        commentCount > 0
                        ?
                        `<span class="comment-count">
                            <i class="bi bi-chat-left-text"></i>
                            ${commentCount}
                         </span>`
                        :
                        ""
                    }


                    <button
                        class="comment-btn"
                        title="Send progress to Admin"
                        onclick="openCommentModal('${escapeAttr(taskId)}')">

                        <i class="bi bi-chat-dots"></i>

                    </button>

                </div>


            </div>


        </div>

    `;

}



/* =====================================================
   OPEN COMMENT MODAL
===================================================== */

function openCommentModal(taskId){

    const task =
        myTasks.find(
            t =>
                String(
                    t.taskId ||
                    t._id
                )
                ===
                String(taskId)
        );


    if(!task){

        alert("Task not found.");

        return;

    }


    selectedTaskId =
        task.taskId ||
        task._id;


    document.getElementById(
        "modalTaskTitle"
    ).textContent =
        task.taskTitle ||
        "Untitled Task";


    document.getElementById(
        "modalTaskDescription"
    ).textContent =
        task.description ||
        "No description provided.";


    document.getElementById(
        "taskComment"
    ).value = "";


    document.getElementById(
        "commentMessage"
    ).innerHTML = "";


    document.getElementById(
        "submitCommentBtn"
    ).disabled = false;


    const modal =
        new bootstrap.Modal(
            document.getElementById(
                "commentModal"
            )
        );


    modal.show();

}



/* =====================================================
   SUBMIT COMMENT
===================================================== */

async function submitTaskComment(){

    const comment =
        document.getElementById(
            "taskComment"
        )
        .value
        .trim();


    const messageBox =
        document.getElementById(
            "commentMessage"
        );


    const button =
        document.getElementById(
            "submitCommentBtn"
        );



    if(!comment){

        messageBox.innerHTML = `

            <span class="text-danger">

                <i class="bi bi-exclamation-circle"></i>

                Please enter a comment.

            </span>

        `;

        return;

    }



    if(!selectedTaskId){

        messageBox.innerHTML = `

            <span class="text-danger">
                Task not selected.
            </span>

        `;

        return;

    }



    button.disabled = true;

    button.innerHTML = `

        <span
            class="spinner-border spinner-border-sm me-2">
        </span>

        Sending...

    `;



    try{

        const response =
            await fetch(
                `/api/task/${encodeURIComponent(selectedTaskId)}/comment`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        employeeId:
                            employeeId,

                        employeeName:
                            employeeName,

                        comment:
                            comment

                    })

                }
            );


        const data =
            await response.json();



        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Comment could not be sent."
            );

        }



        messageBox.innerHTML = `

            <div class="alert alert-success py-2">

                <i class="bi bi-check-circle-fill me-1"></i>

                Comment sent successfully to Admin.

            </div>

        `;



        document.getElementById(
            "taskComment"
        ).value = "";



        /*
           Refresh tasks so comment count updates
        */

        await loadMyTasks();



        setTimeout(() => {

            const modal =
                bootstrap.Modal
                    .getInstance(
                        document.getElementById(
                            "commentModal"
                        )
                    );


            if(modal)
                modal.hide();

        },1000);


    }


    catch(error){

        console.error(
            "Comment Error:",
            error
        );


        messageBox.innerHTML = `

            <div class="alert alert-danger py-2">

                <i class="bi bi-x-circle-fill me-1"></i>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }


    finally{

        button.disabled = false;

        button.innerHTML = `

            <i class="bi bi-send me-1"></i>

            Send to Admin

        `;

    }

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    if(!value)
        return "-";


    const date =
        new Date(value);


    if(isNaN(date))
        return value;


    return date
        .toISOString()
        .split("T")[0];

}



/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



function escapeAttr(value){

    return String(value)

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        );

}

loadMyTasks();
