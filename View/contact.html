            background: rgba(255, 255, 255, 0.07);

        .form-control {

<body>

    <!-- HEADER -->
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135768.png" width="40">

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">

    <!-- CONTACT FORM -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="contact-box">
                    <h2 class="header-title text-center">Contact Us</h2>

                    <form action="save_contact.php" method="POST">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="Enter mobile number" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea name="message" rows="4" class="form-control" placeholder="Write your message..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-custom w-100">Submit</button>

                    </form>
                </div>
            </div>
        </div>
    </div>
